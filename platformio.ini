[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
lib_deps = m5stack/M5Cardputer
monitor_speed = 115200
upload_protocol = esptool

; The tile source list in `maps.txt` is the source of truth. This regenerates
; src/map_defaults.h before every build, so adding a source is a one-line PR.
extra_scripts = pre:tools/gen-map-defaults.py

; If you have several ESP32 boards connected, /dev/ttyACM* numbers can swap on
; reconnect, so it is safest to pin the port by its stable serial path. Find
; yours with `ls /dev/serial/by-id/` and uncomment these two lines:
; upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_XXXXXXXXXXXX-if00
; monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_XXXXXXXXXXXX-if00

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384   ; deep call stack for vector rendering
